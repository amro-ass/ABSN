<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0D1E36">
<title>Gestion des absences</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6;
  --surface:#FFFFFF;
  --ink:#182634;
  --ink-muted:#647082;
  --border:#E4E9EF;
  --primary:#1B3358;
  --primary-dark:#0D1E36;
  --primary-tint:#E8EDF6;
  --gold:#B4862B;
  --gold-tint:#FBF3E3;
  --present:#157A4A;
  --present-tint:#E3F5EC;
  --absent:#B4231E;
  --absent-tint:#FCE9E8;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:22px;
  --shadow:0 1px 2px rgba(13,25,45,.05),0 8px 22px rgba(13,25,45,.07);
  --shadow-lift:0 4px 10px rgba(13,25,45,.14),0 16px 34px rgba(13,25,45,.14);
  --mono:ui-monospace,SFMono-Regular,'IBM Plex Mono',Menlo,monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --sans-ar:'Tajawal','Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(560px 280px at 90% -6%, rgba(27,51,88,.06), transparent 60%),
    var(--bg);
  color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
html[lang="ar"] body{font-family:var(--sans-ar);}
button,input,select{font-family:inherit;}
.hidden{display:none !important;}
#app{max-width:900px;margin:0 auto;padding:0 0 56px;}

/* ---------- Header ---------- */
.topbar{
  background:var(--primary-dark);
  color:#fff;padding:18px 18px 20px;
  position:sticky;top:0;z-index:20;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.topbar-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.school-badge{display:flex;align-items:center;gap:9px;min-width:0;animation:badgeFloat 3.4s ease-in-out infinite;}
@keyframes badgeFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-3px);}
}
.school-emoji{
  flex-shrink:0;display:flex;align-items:center;color:var(--gold);
  animation:emojiGlow 3.4s ease-in-out infinite;
}
.school-emoji svg{display:block;}
@keyframes emojiGlow{
  0%,100%{filter:drop-shadow(0 0 0 rgba(180,134,43,0));}
  50%{filter:drop-shadow(0 0 4px rgba(180,134,43,.65));}
}
.school-name{
  font-size:.82rem;font-weight:700;letter-spacing:.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(100deg,#fff 30%,var(--gold) 50%,#fff 70%);
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent;
  animation:nameShine 4.5s ease-in-out infinite;
}
@supports not (background-clip:text){
  .school-name{color:#fff;background:none;-webkit-text-fill-color:#fff;}
}
@keyframes nameShine{
  0%{background-position:120% 0;}
  55%,100%{background-position:-40% 0;}
}
@media (prefers-reduced-motion:reduce){
  .school-badge,.school-emoji,.school-name{animation:none;}
}
.lang-switch{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px;flex-shrink:0;border:1px solid rgba(255,255,255,.12);}
.lang-switch button{background:transparent;border:none;color:rgba(255,255,255,.75);font-weight:800;font-size:.72rem;padding:6px 13px;border-radius:999px;cursor:pointer;letter-spacing:.04em;transition:background .15s ease,color .15s ease;}
.lang-switch button.active{background:#fff;color:var(--primary-dark);box-shadow:0 2px 6px rgba(0,0,0,.18);}
.topbar h1{margin:0;font-size:1.3rem;font-weight:800;display:flex;align-items:center;gap:9px;letter-spacing:-.01em;}
.topbar p{margin:6px 0 0;font-size:.85rem;color:rgba(255,255,255,.7);}

/* ---------- Cards ---------- */
.card{
  background:var(--surface);margin:14px;padding:19px;
  border-radius:var(--radius-l);box-shadow:var(--shadow);
  border:1px solid rgba(13,25,45,.04);
  animation:riseIn .45s ease both;
}
#app > .card:first-of-type{animation-delay:.05s;}
#app > .card:nth-of-type(2){animation-delay:.12s;}
@keyframes riseIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
.card h2{margin:0 0 15px;font-size:.98rem;font-weight:800;color:var(--primary-dark);display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;}
.card h2 .sub{display:block;font-weight:500;font-size:.76rem;color:var(--ink-muted);width:100%;margin-top:1px;}
#courseInfoTitle::before{content:"🗓️";font-size:.92em;}
#studentsTitleText::before{content:"🧑‍🎓";font-size:.92em;}

/* ---------- Course info form ---------- */
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field.full{grid-column:1 / -1;}
.field-label{font-size:.74rem;color:var(--ink-muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.field input,.field select{
  border:1.5px solid var(--border);border-radius:var(--radius-s);
  padding:10px 12px;font-size:.92rem;background:#fff;color:var(--ink);width:100%;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.field input:disabled{background:var(--primary-tint);color:var(--primary-dark);font-family:var(--mono);font-weight:700;border-color:var(--primary-tint);}
.field input:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(27,51,88,.13);}

/* ---------- Student search / counts ---------- */
.search-box{
  display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);
  border-radius:999px;padding:9px 15px;margin-bottom:14px;background:#F9FAFC;
  transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
}
.search-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(27,51,88,.13);background:#fff;}
.search-box input{border:none;background:transparent;flex:1;font-size:.9rem;color:var(--ink);}
.search-box input:focus{outline:none;}

.count-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px;}
.count-pill{
  flex:1;min-width:90px;text-align:center;padding:11px 6px;border-radius:var(--radius-m);
  background:var(--primary-tint);color:var(--primary-dark);border:1px solid rgba(27,51,88,.06);
}
.count-pill.count-absent{background:var(--absent-tint);color:var(--absent);border-color:rgba(180,35,30,.08);}
.count-pill.count-present{background:var(--present-tint);color:var(--present);border-color:rgba(21,122,74,.08);}
.count-pill b{display:block;font-size:1.28rem;font-family:var(--mono);letter-spacing:-.02em;}
.count-pill span{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;opacity:.85;}

.bulk-actions{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.btn{
  border-radius:999px;padding:10px 16px;font-size:.85rem;font-weight:700;
  border:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  transition:transform .06s ease,box-shadow .15s ease,filter .15s ease,background .15s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:#fff;box-shadow:0 6px 16px rgba(27,51,88,.32);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-primary:disabled{background:#A6AFBB;box-shadow:none;cursor:not-allowed;filter:none;}
.btn-ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--border);}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
.btn-ghost.red{color:var(--absent);}
.btn-ghost.red:hover{border-color:var(--absent);}
.btn-ghost.green{color:var(--present);}
.btn-block{width:100%;justify-content:center;padding:15px;font-size:.96rem;border-radius:var(--radius-m);}

/* ---------- Student list ---------- */
.student-list{display:grid;grid-template-columns:1fr;gap:8px;}
.student-card{
  display:flex;align-items:center;gap:11px;border:1.5px solid var(--border);
  border-radius:var(--radius-m);padding:10px 12px;cursor:pointer;
  background:#fff;transition:background .12s ease,border-color .12s ease,transform .06s ease;
}
.student-card:hover{border-color:#c3ccd8;transform:translateY(-1px);}
.student-card:active{transform:translateY(0);}
.student-card.is-absent{background:var(--absent-tint);border-color:rgba(180,35,30,.35);}
.student-card input[type=checkbox]{width:19px;height:19px;flex-shrink:0;accent-color:var(--absent);}
.s-rank{
  flex-shrink:0;min-width:20px;text-align:center;font-family:var(--mono);
  font-size:.75rem;font-weight:700;color:var(--ink-muted);
}
.student-card.is-absent .s-rank{color:var(--absent);}
.s-avatar{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  background:var(--primary-tint);color:var(--primary-dark);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;
}
.student-card.is-absent .s-avatar{background:#fff;color:var(--absent);}
.student-card .s-name{flex:1;font-size:.92rem;font-weight:600;}
.student-card .s-num{font-family:var(--mono);font-size:.75rem;color:var(--ink-muted);background:var(--bg);padding:3px 8px;border-radius:7px;}
.student-card.is-absent .s-num{background:#fff;color:var(--absent);}
.empty-state,.loading-state{text-align:center;color:var(--ink-muted);padding:32px 12px;font-size:.86rem;}

/* ---------- Save section ---------- */
.save-bar{margin:16px 14px 0;display:flex;flex-direction:column;gap:10px;}
.msg{
  border-radius:var(--radius-s);padding:12px 15px;font-size:.85rem;font-weight:700;
  display:none;border:1px solid transparent;
}
.msg.show{display:block;animation:riseIn .25s ease both;}
.msg.msg-error{background:var(--absent-tint);color:var(--absent);border-color:rgba(180,35,30,.14);}
.msg.msg-success{background:var(--present-tint);color:var(--present);border-color:rgba(21,122,74,.14);}
.spinner{
  width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;animation:spin .7s linear infinite;display:inline-block;
}
@keyframes spin{to{transform:rotate(360deg);}}

.app-footer{text-align:center;padding:22px 18px 8px;font-size:.74rem;color:var(--ink-muted);}
.app-footer::before{content:"";display:block;width:34px;height:3px;border-radius:3px;background:var(--gold);margin:0 auto 10px;}

@media (min-width:640px){
  .student-list{grid-template-columns:1fr 1fr;}
}
@media (min-width:860px){
  .field-grid{grid-template-columns:repeat(3,1fr);}
  .field.full{grid-column:auto;}
}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="topbar-top">
      <div class="school-badge">
        <span class="school-emoji" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3L1.5 8.25L12 13.5L22.5 8.25L12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>

      </div>
      <div class="field">
        <label class="field-label" id="sessionTypeLabel" for="sessionTypeField"></label>
        <select id="sessionTypeField">
          <option value="single"></option>
          <option value="double"></option>
        </select>
      </div>
      <div class="field">
        <label class="field-label" id="periodLabel" for="periodField"></label>

      </div>
      <div class="field">
        <label class="field-label" id="teacherLabel" for="teacherField"></label>
        <select id="teacherField">
          <option value="">— —</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label" id="subjectLabel" for="subjectField"></label>
        <select id="subjectField">
          <option value="">— —</option>
        </select>
      </div>
      <div class="field full">
        <label class="field-label" id="classLabel" for="classField"></label>
        <select id="classField">
          <option value="">— —</option>
        </select>
      </div>
    </div>
  </section>

  <section class="card">
    <h2><span id="studentsTitleText"></span><span class="sub" id="classSubLabel"></span></h2>

    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchField" placeholder="" disabled>
    </div>

    <div class="count-row">
      <div class="count-pill"><b id="countTotal">0</b><span id="totalLabel"></span></div>
      <div class="count-pill count-absent"><b id="countAbsent">0</b><span id="absentLabelSpan"></span></div>
      <div class="count-pill count-present"><b id="countPresent">0</b><span id="presentLabelSpan"></span></div>
    </div>

    <div class="bulk-actions">
      <button class="btn btn-ghost red" id="selectAllBtn" type="button"></button>
      <button class="btn btn-ghost" id="selectNoneBtn" type="button"></button>
    </div>

    <div class="student-list" id="studentList">
      <div class="empty-state" id="initialEmptyState"></div>
    </div>
  </section>

  <div class="save-bar">
    <div class="msg" id="statusMsg"></div>
    <button class="btn btn-primary btn-block" id="saveBtn" type="button"></button>
  </div>

  <footer class="app-footer" id="appFooter"></footer>
</div>

    noStudentFound: "لم يتم العثور على أي تلميذ.",
    saveBtn: "✓ تسجيل الغيابات",
    savingBtn: "جارٍ التسجيل...",
    footer: "متصل بـ Google Sheets عبر SheetDB",
    errNoClass: "⚠ الرجاء اختيار قسم.",
    errNoPeriod: "⚠ الرجاء اختيار توقيت.",
    errNoTeacher: "⚠ الرجاء اختيار أستاذ(ة).",
    errNoSubject: "⚠ الرجاء اختيار مادة.",
    errNoAbsent: "⚠ الرجاء اختيار تلميذ غائب واحد على الأقل.",
    duplicateConfirm: "⚠ يبدو أن غيابات هذا التاريخ والتوقيت والمادة والقسم مسجلة بالفعل.\n\nهل تريد المتابعة رغم ذلك؟",
    saveSuccess: (n, h)=> "✓ تم تسجيل " + n + " غياب(ات) بنجاح (" + h + " ساعة إجمالاً).",
    saveError: "❌ تعذر تسجيل الغيابات. تحقق من اتصالك بالإنترنت.",
    sheetNotFound: (name)=> '❌ الورقة "' + name + '" غير موجودة في Google Sheets. تحقق من الاسم الدقيق لعلامة التبويب (يراعي حالة الأحرف) وصحح الثابت STUDENTS_SHEET في الكود.',
    sheetDbRefused: (code)=> '❌ رفض SheetDB الطلب (رمز ' + code + '). قد يكون هذا بسبب خطة SheetDB (ميزة "عدة أوراق" أو حصة الطلبات) أو قيد CORS/IP على واجهتك البرمجية. تحقق من إعدادات حساب SheetDB الخاص بك.',
    sheetDbError: (code)=> '❌ أعاد SheetDB خطأ (رمز ' + code + '). تحقق من إعدادات واجهة SheetDB البرمجية.',
    noRowsFound: (name)=> '⚠ استجابت الورقة "' + name + '" لكنها لا تحتوي على أي سطر قابل للاستخدام. تحقق من وجود بيانات أسفل رؤوس الأعمدة.',
    noClassDetectedMsg: (n, keys)=> '⚠ تم استلام أسطر (' + n + ') لكن لم يتم التعرف على أي عمود "قسم" أو "تلميذ". الأعمدة الموجودة: ' + keys + '. أعد تسمية أعمدتك أو أضف تسمياتها إلى CLASS_COLUMN_ALIASES / NAME_COLUMN_ALIASES.',
    loadError: "❌ تعذر الاتصال بـ SheetDB. تحقق من اتصالك بالإنترنت، أو راجع console المتصفح (F12) لمزيد من التفاصيل.",
    studentsCount: (className, n)=> className + " · " + n + " تلميذ(ة)"
  }
};

/* ============ State ============ */
let allStudents = [];      // [{name, num, className}]
let classNames = [];       // sorted unique class list
let currentClass = "";
let currentSessionType = "single"; // "single" = 1h, "double" = 2h consecutive
let currentSearch = "";
let absentByClass = {};    // { className: Set(studentKey) }
let teacherSubjects = {};  // { teacherName: [subject, ...] }
let teacherNames = [];     // sorted unique teacher list
let allSubjects = [];      // sorted unique subject list (fallback / no teacher selected)
let currentLang = localStorage.getItem("appLang") === "ar" ? "ar" : "fr";
let isSaving = false;

function t(){ return translations[currentLang]; }

/* ============ Helpers ============ */
function $(id){ return document.getElementById(id); }

function escapeHtml(str){
  if(str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function normalizeKey(str){
  return String(str || "").trim().toLowerCase();
}

function pad2(n){ return n < 10 ? "0"+n : ""+n; }

function todayFR(){
  const d = new Date();
  return pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+"/"+d.getFullYear();
}

function studentKey(s){
  return (s.num ? s.num+"|" : "") + s.name;
}

function getAbsentSet(className){
  if(!absentByClass[className]) absentByClass[className] = new Set();
  return absentByClass[className];
}

/* ============ Language switching (display text only) ============ */
function setLanguage(lang){
  currentLang = (lang === "ar") ? "ar" : "fr";
  localStorage.setItem("appLang", currentLang);
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";
  renderStaticText();
  refreshDynamicSelectsText();
  renderStudents();
}

function renderStaticText(){
  const tr = t();
  document.title = tr.schoolName + " — " + tr.pageTitle;
  $("schoolNameLabel").textContent = tr.schoolName;
  $("headerTitle").textContent = tr.headerTitle;
  $("headerSubtitle").textContent = tr.headerSubtitle;
  $("courseInfoTitle").textContent = tr.courseInfo;
  $("dateLabel").textContent = tr.date;
  $("sessionTypeLabel").textContent = tr.sessionType;
  $("periodLabel").textContent = tr.period;
  $("teacherLabel").textContent = tr.teacher;
  $("subjectLabel").textContent = tr.subject;
  $("classLabel").textContent = tr.classSection;
  $("studentsTitleText").textContent = tr.studentsOfClass;
  $("searchField").placeholder = tr.searchPlaceholder;
  $("totalLabel").textContent = tr.totalStudents;
  $("absentLabelSpan").textContent = tr.absentLabel;
  $("presentLabelSpan").textContent = tr.presentLabel;
  $("selectAllBtn").textContent = tr.selectAll;
  $("selectNoneBtn").textContent = tr.selectNone;
  $("appFooter").textContent = tr.footer;
  if(!isSaving) $("saveBtn").textContent = tr.saveBtn;
  $("langFr").classList.toggle("active", currentLang === "fr");
  $("langAr").classList.toggle("active", currentLang === "ar");
}

/* Re-translate select placeholders/options while preserving current selections (no data reload) */
function refreshDynamicSelectsText(){
  const tr = t();

  // Session type select
  const sessionSel = $("sessionTypeField");
  const curSessionType = sessionSel.value || currentSessionType;
  sessionSel.innerHTML =
    `<option value="single">${tr.sessionTypeSingle}</option>` +
    `<option value="double">${tr.sessionTypeDouble}</option>`;
  sessionSel.value = curSessionType;
  currentSessionType = sessionSel.value || "single";

  // Period select (options depend on the selected session type)
  const periodSel = $("periodField");
  const curPeriod = periodSel.value;
  const periodsList = currentPeriodsList();
  periodSel.innerHTML = `<option value="">${tr.choose}</option>` +
    periodsList.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join("");
  periodSel.value = periodsList.includes(curPeriod) ? curPeriod : "";

  // Teacher select
  const teacherSel = $("teacherField");
  const curTeacher = teacherSel.value;
  if(teacherNames.length === 0){
    teacherSel.innerHTML = `<option value="">${tr.noTeacherFound}</option>`;
  } else {
    teacherSel.innerHTML = `<option value="">${tr.chooseTeacher}</option>` +
      teacherNames.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join("");
    teacherSel.value = curTeacher;
  }

  // Subject select (preserve selection)
  const curSubject = $("subjectField").value;
  populateSubjectSelect(teacherSel.value);
  if(curSubject) $("subjectField").value = curSubject;

  // Class select
  const classSel = $("classField");
  const curClass = classSel.value;
  if(classNames.length > 0){
    classSel.innerHTML = `<option value="">${tr.chooseClass}</option>` +
      classNames.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
    classSel.value = curClass;
  }
}

/* ============ Populate fixed fields ============ */
function initStaticFields(){
  $("dateField").value = todayFR();
  refreshDynamicSelectsText();
}

/* ============ Load students from SheetDB ============ */
async function loadStudents(){
  const classSel = $("classField");
  classSel.innerHTML = `<option value="">${t().loadingClasses}</option>`;
  try{
    const res = await fetch(API_URL + "?sheet=" + encodeURIComponent(STUDENTS_SHEET));

    if(!res.ok){
      const bodyText = await res.text().catch(()=> "");
      console.error("SheetDB error", res.status, bodyText);
      classSel.innerHTML = `<option value="">${t().loadingError}</option>`;
      if(res.status === 404){
        showMessage(t().sheetNotFound(STUDENTS_SHEET), "error");
      } else if(res.status === 402 || res.status === 403){
        showMessage(t().sheetDbRefused(res.status), "error");
      } else {
        showMessage(t().sheetDbError(res.status), "error");
      }
      return;
    }

    const rows = await res.json();
    console.log("SheetDB rows received:", rows);

    if(!Array.isArray(rows) || rows.length === 0){
      classSel.innerHTML = `<option value="">${t().noClassFound}</option>`;
      showMessage(t().noRowsFound(STUDENTS_SHEET), "error");
      return;
    }

    const sampleKeys = Object.keys(rows[0]);
    const classKey = findColumn(sampleKeys, CLASS_COLUMN_ALIASES);
    const nameKey = findColumn(sampleKeys, NAME_COLUMN_ALIASES);
    const numKey = findColumn(sampleKeys, NUM_COLUMN_ALIASES);
    const teacherKey = findColumn(sampleKeys, TEACHER_COLUMN_ALIASES);
    const subjectKey = findColumn(sampleKeys, SUBJECT_COLUMN_ALIASES);

    allStudents = rows.map(r=>{
      const name = nameKey ? String(r[nameKey] || "").trim() : "";
      const num = numKey ? String(r[numKey] || "").trim() : "";
      const className = classKey ? String(r[classKey] || "").trim() : "";
      return { name, num, className };
    }).filter(s => s.name && s.className);

    const seen = new Set();
    classNames = [];
    allStudents.forEach(s=>{
      if(!seen.has(s.className)){ seen.add(s.className); classNames.push(s.className); }
    });
    classNames.sort((a,b)=> a.localeCompare(b, "fr", {numeric:true}));

    /* Build teacher -> subject(s) mapping from the same sheet */
    teacherSubjects = {};
    const subjSeen = new Set();
    allSubjects = [];
    if(teacherKey){
      rows.forEach(r=>{
        const teacher = String(r[teacherKey] || "").trim();
        if(!teacher) return;
        const subject = subjectKey ? String(r[subjectKey] || "").trim() : "";
        if(!teacherSubjects[teacher]) teacherSubjects[teacher] = [];
        if(subject && !teacherSubjects[teacher].includes(subject)) teacherSubjects[teacher].push(subject);
        if(subject && !subjSeen.has(subject)){ subjSeen.add(subject); allSubjects.push(subject); }
      });
      teacherNames = Object.keys(teacherSubjects).sort((a,b)=> a.localeCompare(b, "fr"));
      allSubjects.sort((a,b)=> a.localeCompare(b, "fr"));
    } else {
      teacherNames = [];
    }
    populateTeacherSelect();

    if(classNames.length === 0){
      classSel.innerHTML = `<option value="">${t().noClassDetected}</option>`;
      showMessage(t().noClassDetectedMsg(rows.length, sampleKeys.join(", ")), "error");
      return;
    }

    classSel.innerHTML = `<option value="">${t().chooseClass}</option>` +
      classNames.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");

  }catch(err){
    console.error("Fetch failed", err);
    classSel.innerHTML = `<option value="">${t().loadingError}</option>`;
    showMessage(t().loadError, "error");
  }
}

function findColumn(keys, aliases){
  for(const k of keys){
    if(aliases.includes(normalizeKey(k))) return k;
  }
  // fallback: partial match
  for(const k of keys){
    const nk = normalizeKey(k);
    if(aliases.some(a => nk.includes(a) || a.includes(nk))) return k;
  }
  return null;
}

/* ============ Teacher / subject selects ============ */
function populateTeacherSelect(){
  const teacherSel = $("teacherField");
  if(teacherNames.length === 0){
    teacherSel.innerHTML = `<option value="">${t().noTeacherFound}</option>`;
    populateSubjectSelect("");
    return;
  }
  teacherSel.innerHTML = `<option value="">${t().chooseTeacher}</option>` +
    teacherNames.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join("");
  populateSubjectSelect("");
}

function populateSubjectSelect(teacher){
  const subjectSel = $("subjectField");
  const subjects = teacher && teacherSubjects[teacher] ? teacherSubjects[teacher] : [];

  if(teacher && subjects.length > 0){
    subjectSel.innerHTML = subjects.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
    subjectSel.value = subjects[0];
  } else if(teacher){
    subjectSel.innerHTML = `<option value="">${t().noSubjectForTeacher}</option>`;
  } else if(allSubjects.length > 0){
    subjectSel.innerHTML = `<option value="">${t().chooseTeacherFirst}</option>` +
      allSubjects.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
  } else {
    subjectSel.innerHTML = `<option value="">${t().chooseTeacher}</option>`;
  }
}

/* ============ Render students of selected class ============ */
function renderStudents(){
  const listEl = $("studentList");
  const searchInput = $("searchField");
  const subLabel = $("classSubLabel");

  if(!currentClass){
    listEl.innerHTML = `<div class="empty-state">${t().emptyNoClass}</div>`;
    searchInput.disabled = true;
    subLabel.textContent = t().subLabelDefault;
    updateCounts([]);
    return;
  }

  searchInput.disabled = false;
  const classList = allStudents.filter(s => s.className === currentClass);
  subLabel.textContent = t().studentsCount(currentClass, classList.length);

  const q = normalizeKey(currentSearch);
  const filtered = q
    ? classList.filter(s => normalizeKey(s.name).includes(q) || normalizeKey(s.num).includes(q))
    : classList;

  const absentSet = getAbsentSet(currentClass);

  if(filtered.length === 0){
    listEl.innerHTML = `<div class="empty-state">${t().noStudentFound}</div>`;
  } else {
    listEl.innerHTML = filtered.map((s, idx)=>{
      const key = studentKey(s);
      const isAbsent = absentSet.has(key);
      const initial = (s.name || "?").trim().charAt(0).toUpperCase();
      return `<label class="student-card${isAbsent ? " is-absent" : ""}" data-key="${escapeHtml(key)}">
        <input type="checkbox" ${isAbsent ? "checked" : ""}>
        <span class="s-rank">${idx + 1}</span>
        <span class="s-avatar">${escapeHtml(initial)}</span>
        <span class="s-name">${escapeHtml(s.name)}</span>
        ${s.num ? `<span class="s-num">${escapeHtml(s.num)}</span>` : ""}
      </label>`;
    }).join("");

    listEl.querySelectorAll(".student-card").forEach(card=>{
      const checkbox = card.querySelector("input");
      card.addEventListener("click", (e)=>{
        e.preventDefault();
        const key = card.dataset.key;
        const set = getAbsentSet(currentClass);
        if(set.has(key)) set.delete(key); else set.add(key);
        checkbox.checked = set.has(key);
        card.classList.toggle("is-absent", set.has(key));
        updateCounts(classList);
      });
    });
  }

  updateCounts(classList);
}

function updateCounts(classList){
  const total = classList.length;
  const absentSet = currentClass ? getAbsentSet(currentClass) : new Set();
  // only count absents that still belong to the current class list
  const validKeys = new Set(classList.map(studentKey));
  let absentCount = 0;
  absentSet.forEach(k=>{ if(validKeys.has(k)) absentCount++; });
  $("countTotal").textContent = total;
  $("countAbsent").textContent = absentCount;
  $("countPresent").textContent = Math.max(0, total - absentCount);
}

/* ============ Messages ============ */
function showMessage(text, type){
  const el = $("statusMsg");
  el.textContent = text;
  el.className = "msg show " + (type === "error" ? "msg-error" : "msg-success");
}
function clearMessage(){
  const el = $("statusMsg");
  el.className = "msg";
  el.textContent = "";
}

/* ============ Save (record absences only) ============ */
async function handleSave(){
  clearMessage();

  const sessionType = $("sessionTypeField").value === "double" ? "double" : "single";
  const period = $("periodField").value;
  const subject = $("subjectField").value.trim();
  const teacher = $("teacherField").value.trim();
  const className = $("classField").value;
  const hoursCount = SESSION_HOURS[sessionType] || 1;

  if(!className){ showMessage(t().errNoClass, "error"); return; }
  if(!period){ showMessage(t().errNoPeriod, "error"); return; }
  if(!teacher){ showMessage(t().errNoTeacher, "error"); return; }
  if(!subject){ showMessage(t().errNoSubject, "error"); return; }

  const classList = allStudents.filter(s => s.className === className);
  const absentSet = getAbsentSet(className);
  const validKeys = new Set(classList.map(studentKey));
  const absentStudents = classList.filter(s => absentSet.has(studentKey(s)));

  if(absentStudents.length === 0){ showMessage(t().errNoAbsent, "error"); return; }

  const date = $("dateField").value;

  // Duplicate-protection check (best effort, never blocks silently)
  try{
    const checkUrl = API_URL + "/search?sheet=" + encodeURIComponent(ATTENDANCE_SHEET)
      + "&Date=" + encodeURIComponent(date)
      + "&Heure=" + encodeURIComponent(period)
      + "&Matière=" + encodeURIComponent(subject)
      + "&Classe=" + encodeURIComponent(className);
    const checkRes = await fetch(checkUrl);
    if(checkRes.ok){
      const existing = await checkRes.json();
      if(Array.isArray(existing) && existing.length > 0){
        const proceed = confirm(t().duplicateConfirm);
        if(!proceed) return;
      }
    }
  }catch(e){ /* ignore check failures, proceed to save */ }

  const rows = absentStudents.map(s => ({
    "Date": date,
    "Heure": period,
    "Nb Heures": hoursCount,
    "Matière": subject,
    "Professeur": teacher,
    "Classe": className,
    "Élève": s.name,
    "N°": s.num,
    "Statut": "Absent"
  }));

  const saveBtn = $("saveBtn");
  isSaving = true;
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<span class="spinner"></span> ' + t().savingBtn;

  try{
    const res = await fetch(API_URL + "?sheet=" + encodeURIComponent(ATTENDANCE_SHEET), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ data: rows })
    });
    if(!res.ok) throw new Error("save failed");

    showMessage(t().saveSuccess(rows.length, rows.length * hoursCount), "success");
    absentByClass[className] = new Set();
    renderStudents();
  }catch(err){
    showMessage(t().saveError, "error");
  }finally{
    isSaving = false;
    saveBtn.disabled = false;
    saveBtn.textContent = t().saveBtn;
  }
}

/* ============ Event wiring ============ */
function wireEvents(){
  $("langFr").addEventListener("click", ()=> setLanguage("fr"));
  $("langAr").addEventListener("click", ()=> setLanguage("ar"));

  $("teacherField").addEventListener("change", (e)=>{
    populateSubjectSelect(e.target.value);
  });

  $("sessionTypeField").addEventListener("change", (e)=>{
    currentSessionType = e.target.value === "double" ? "double" : "single";
    const periodSel = $("periodField");
    const periodsList = currentPeriodsList();
    periodSel.innerHTML = `<option value="">${t().choose}</option>` +
      periodsList.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join("");
    periodSel.value = "";
  });

  $("classField").addEventListener("change", (e)=>{
    currentClass = e.target.value;
    $("searchField").value = "";
    currentSearch = "";
    renderStudents();
  });

  $("searchField").addEventListener("input", (e)=>{
    currentSearch = e.target.value;
    renderStudents();
  });

  $("selectAllBtn").addEventListener("click", ()=>{
    if(!currentClass) return;
    const classList = allStudents.filter(s => s.className === currentClass);
    const set = getAbsentSet(currentClass);
    classList.forEach(s => set.add(studentKey(s)));
    renderStudents();
  });

  $("selectNoneBtn").addEventListener("click", ()=>{
    if(!currentClass) return;
    absentByClass[currentClass] = new Set();
    renderStudents();
  });

  $("saveBtn").addEventListener("click", handleSave);
}

/* ============ Init ============ */
function init(){
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";
  renderStaticText();
  initStaticFields();
  renderStudents();
  wireEvents();
  loadStudents();
}
document.addEventListener("DOMContentLoaded", init);
})();
</script>
